name: OSAura boot CI

on:
  push:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'runtime/**'
      - 'scripts/make-image.sh'
      - 'scripts/make-jx-runtime-book.py'
      - 'Makefile'
      - '.github/workflows/osaura-boot-ci.yml'
  pull_request:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'runtime/**'
      - 'scripts/make-image.sh'
      - 'scripts/make-jx-runtime-book.py'
      - 'Makefile'
      - '.github/workflows/osaura-boot-ci.yml'

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UEFI image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnu-efi mtools dosfstools qemu-system-x86 ovmf socat

      - name: Build BOOTX64.EFI and native kernel
        run: make efi

      - name: Validate linked kernel objects
        run: |
          test -s build/loader.o
          test -s build/kernel.o
          test -s build/mm.o
          test -s build/scheduler.o
          test -s build/jx-runtime.o
          test -s build/x86_64.o
          test -s build/bootx64.so
          nm build/kernel.o | grep -F 'osaura_kernel_main'
          nm build/kernel.o | grep -F 'osaura_ticks'
          nm build/mm.o | grep -F 'osaura_vm_init'
          nm build/scheduler.o | grep -F 'osaura_scheduler_on_timer'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_load_book'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_task'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_bus_ticks'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_bus_collects'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_bag_checkpoints'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_channel_deliveries'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_prepared_calls'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_hot_dispatches'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_reaction_runs'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_reaction_value'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_generation_swaps'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_active_generation'
          nm build/jx-runtime.o | grep -F 'osaura_jx_runtime_previous_generation'
          nm build/x86_64.o | grep -F 'osaura_arch_write_cr3'
          nm build/x86_64.o | grep -F 'osaura_isr_32'
          nm build/x86_64.o | grep -F 'osaura_isr_33'
          objdump -h build/bootx64.so > build/sections.txt
          grep -F '.text' build/sections.txt
          grep -F '.data' build/sections.txt

      - name: Build USB image
        run: make image

      - name: Validate artifacts
        run: |
          test -s build/BOOTX64.EFI
          test -s build/runtime.64B
          test -s build/osaura.img
          file build/BOOTX64.EFI
          mdir -i build/osaura.img ::/EFI/BOOT
          mdir -i build/osaura.img ::/OSAURA
          rm -f build/runtime-from-image.64B
          mcopy -i build/osaura.img ::/OSAURA/runtime.64B build/runtime-from-image.64B
          cmp build/runtime.64B build/runtime-from-image.64B

      - name: Boot preemptive JX runtime under OVMF
        run: |
          if [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            echo 'No matched OVMF CODE/VARS pair found'
            exit 1
          fi

          cp "$OVMF_VARS" build/OVMF_VARS.fd
          rm -f build/qemu-monitor build/qemu-debug.log

          set +e
          timeout 16s qemu-system-x86_64 \
            -machine q35 \
            -m 256M \
            -vga std \
            -display none \
            -serial stdio \
            -monitor unix:build/qemu-monitor,server=on,wait=off \
            -d int,cpu_reset \
            -D build/qemu-debug.log \
            -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive format=raw,file=build/osaura.img \
            > build/qemu.log 2>&1 &
          qemu_pid=$!
          set -e

          for _ in $(seq 1 40); do
            [ -S build/qemu-monitor ] && break
            sleep 0.1
          done
          test -S build/qemu-monitor

          prompt_seen=0
          for _ in $(seq 1 100); do
            if grep -Fq 'OSAURA>' build/qemu.log; then prompt_seen=1; break; fi
            sleep 0.1
          done
          if [ "$prompt_seen" -ne 1 ]; then
            echo 'OSAura prompt was not reached; early serial log follows:'
            cat build/qemu.log || true
            echo 'Last QEMU interrupt trace lines:'
            tail -n 200 build/qemu-debug.log || true
            printf 'quit\n' | socat - UNIX-CONNECT:build/qemu-monitor || true
            wait "$qemu_pid" || true
            exit 1
          fi

          # The runtime announces only after the compiler-authored Bag schema,
          # all compact prepared-call tiers, O(1) hot routes, reactions, the
          # generation 1->2 quiescent cutover, channels and both applied bus
          # entrypoints have executed under real PIT preemption.
          jx_seen=0
          for _ in $(seq 1 80); do
            if grep -Fq 'JX GENERATION 1->2: ACTIVE' build/qemu.log && \
               grep -Fq 'JX PREPARED CALLS: ACTIVE' build/qemu.log && \
               grep -Fq 'JX BUS.COLLECT: ACTIVE' build/qemu.log; then
              jx_seen=1
              break
            fi
            sleep 0.1
          done

          {
            echo 'sendkey h'
            echo 'sendkey e'
            echo 'sendkey l'
            echo 'sendkey p'
            echo 'sendkey ret'
          } | socat - UNIX-CONNECT:build/qemu-monitor

          help_seen=0
          for _ in $(seq 1 60); do
            if grep -Fq 'HELP ABOUT MEM VM TASKS TICKS ALLOC CLEAR HALT' build/qemu.log; then help_seen=1; break; fi
            sleep 0.1
          done

          {
            echo 'sendkey v'
            echo 'sendkey m'
            echo 'sendkey ret'
          } | socat - UNIX-CONNECT:build/qemu-monitor

          vm_seen=0
          for _ in $(seq 1 60); do
            if grep -Fq 'DIRECT MAP GIB: 64' build/qemu.log; then vm_seen=1; break; fi
            sleep 0.1
          done

          {
            echo 'sendkey t'
            echo 'sendkey a'
            echo 'sendkey s'
            echo 'sendkey k'
            echo 'sendkey s'
            echo 'sendkey ret'
          } | socat - UNIX-CONNECT:build/qemu-monitor

          tasks_seen=0
          for _ in $(seq 1 60); do
            if grep -Fq 'IDLE TICKS:' build/qemu.log; then tasks_seen=1; break; fi
            sleep 0.1
          done

          {
            echo 'sendkey a'
            echo 'sendkey l'
            echo 'sendkey l'
            echo 'sendkey o'
            echo 'sendkey c'
            echo 'sendkey ret'
          } | socat - UNIX-CONNECT:build/qemu-monitor

          alloc_seen=0
          for _ in $(seq 1 60); do
            if grep -Fq 'PHYSICAL PAGE FRAME ALLOCATED' build/qemu.log; then alloc_seen=1; break; fi
            sleep 0.1
          done

          printf 'quit\n' | socat - UNIX-CONNECT:build/qemu-monitor || true
          set +e
          wait "$qemu_pid"
          rc=$?
          set -e

          cat build/qemu.log
          if [ "$jx_seen" -ne 1 ] || [ "$help_seen" -ne 1 ] || [ "$vm_seen" -ne 1 ] || [ "$tasks_seen" -ne 1 ] || [ "$alloc_seen" -ne 1 ]; then
            echo 'JX generation/hot-register scheduler gate failed; last QEMU interrupt trace lines:'
            tail -n 200 build/qemu-debug.log || true
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          test "$jx_seen" -eq 1
          test "$help_seen" -eq 1
          test "$vm_seen" -eq 1
          test "$tasks_seen" -eq 1
          test "$alloc_seen" -eq 1
          grep -Fq 'OSAURA KERNEL 0.5-DEV' build/qemu.log
          grep -Fq 'UEFI BOOT SERVICES: EXITED' build/qemu.log
          grep -Fq 'BOOT: CR3 OWNED' build/qemu.log
          grep -Fq 'BOOT: SCHEDULER READY' build/qemu.log
          grep -Fq 'PAGE TABLES: OWNED' build/qemu.log
          grep -Fq 'SCHEDULER: READY' build/qemu.log
          grep -Fq 'PIT IRQ0: ACTIVE' build/qemu.log
          grep -Fq 'PS2 IRQ1: ACTIVE' build/qemu.log
          grep -Fq 'JX 64B: VERIFIED' build/qemu.log
          grep -Fq 'JX 64B CODE/APPLIED-BUS: LOADED' build/qemu.log
          grep -Fq 'JX BAG SCHEMA: LINKED' build/qemu.log
          grep -Fq 'JX BAG: ACTIVE' build/qemu.log
          grep -Fq 'JX BAG CHECKPOINT: ACTIVE' build/qemu.log
          grep -Fq 'JX PREPARED CALLS: ACTIVE' build/qemu.log
          grep -Fq 'JX HOT REGISTERS: ACTIVE' build/qemu.log
          grep -Fq 'JX REACTIONS: ACTIVE' build/qemu.log
          grep -Fq 'JX GENERATION 1->2: ACTIVE' build/qemu.log
          grep -Fq 'JX CHANNEL BUS: ACTIVE' build/qemu.log
          grep -Fq 'JX CHANNEL SWITCH: ACTIVE' build/qemu.log
          grep -Fq 'JX RUNTIME: ACTIVE' build/qemu.log
          grep -Fq 'JX APPLIED ABI: 1' build/qemu.log
          grep -Fq 'JX PAGE: 7F0001 7F0002' build/qemu.log
          grep -Fq 'JX BUS.TICK: ACTIVE' build/qemu.log
          grep -Fq 'JX BUS.COLLECT: ACTIVE' build/qemu.log
          grep -Fq 'HELP ABOUT MEM VM TASKS TICKS ALLOC CLEAR HALT' build/qemu.log
          grep -Fq 'DIRECT MAP GIB: 64' build/qemu.log
          grep -Fq 'TASKS: 3' build/qemu.log
          grep -Eq 'JX-RUNTIME TICKS: [1-9][0-9]*' build/qemu.log
          grep -Eq 'IDLE TICKS: [1-9][0-9]*' build/qemu.log
          grep -Fq 'PHYSICAL PAGE FRAME ALLOCATED' build/qemu.log

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaura-uefi-x86_64
          path: |
            build/BOOTX64.EFI
            build/runtime.64B
            build/osaura.img
            build/qemu.log
            build/qemu-debug.log
