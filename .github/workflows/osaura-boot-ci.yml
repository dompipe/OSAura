name: OSAura boot CI

on:
  push:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'scripts/make-image.sh'
      - 'Makefile'
      - '.github/workflows/osaura-boot-ci.yml'
  pull_request:
    paths:
      - 'boot/**'
      - 'kernel/**'
      - 'scripts/make-image.sh'
      - 'Makefile'
      - '.github/workflows/osaura-boot-ci.yml'

jobs:
  build-uefi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install UEFI image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnu-efi mtools dosfstools qemu-system-x86 ovmf socat

      - name: Build BOOTX64.EFI and native kernel
        run: make efi

      - name: Validate linked kernel objects
        run: |
          test -s build/loader.o
          test -s build/kernel.o
          test -s build/x86_64.o
          test -s build/bootx64.so
          nm build/kernel.o | grep -F 'osaura_kernel_main'
          nm build/kernel.o | grep -F 'osaura_ticks'
          nm build/x86_64.o | grep -F 'osaura_isr_32'
          nm build/x86_64.o | grep -F 'osaura_isr_33'
          objdump -h build/bootx64.so > build/sections.txt
          grep -F '.text' build/sections.txt
          grep -F '.data' build/sections.txt

      - name: Build USB image
        run: make image

      - name: Validate artifacts
        run: |
          test -s build/BOOTX64.EFI
          test -s build/osaura.img
          file build/BOOTX64.EFI
          mdir -i build/osaura.img ::/EFI/BOOT
          mdir -i build/osaura.img ::/OSAURA

      - name: Boot interrupt-driven kernel under OVMF
        run: |
          if [ -f /usr/share/OVMF/OVMF_CODE.fd ] && [ -f /usr/share/OVMF/OVMF_VARS.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
          elif [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ] && [ -f /usr/share/OVMF/OVMF_VARS_4M.fd ]; then
            OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
            OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            echo 'No matched OVMF CODE/VARS pair found'
            exit 1
          fi

          cp "$OVMF_VARS" build/OVMF_VARS.fd
          rm -f build/qemu-monitor build/qemu-debug.log

          set +e
          timeout 12s qemu-system-x86_64 \
            -machine q35 \
            -m 256M \
            -vga std \
            -display none \
            -serial stdio \
            -monitor unix:build/qemu-monitor,server=on,wait=off \
            -d int,cpu_reset \
            -D build/qemu-debug.log \
            -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive format=raw,file=build/osaura.img \
            > build/qemu.log 2>&1 &
          qemu_pid=$!
          set -e

          for _ in $(seq 1 40); do
            [ -S build/qemu-monitor ] && break
            sleep 0.1
          done
          test -S build/qemu-monitor

          prompt_seen=0
          for _ in $(seq 1 80); do
            if grep -Fq 'OSAURA>' build/qemu.log; then prompt_seen=1; break; fi
            sleep 0.1
          done
          if [ "$prompt_seen" -ne 1 ]; then
            echo 'OSAura prompt was not reached; early serial log follows:'
            cat build/qemu.log || true
            echo 'Last QEMU interrupt trace lines:'
            tail -n 120 build/qemu-debug.log || true
            printf 'quit\n' | socat - UNIX-CONNECT:build/qemu-monitor || true
            wait "$qemu_pid" || true
            exit 1
          fi

          {
            echo 'sendkey h'
            echo 'sendkey e'
            echo 'sendkey l'
            echo 'sendkey p'
            echo 'sendkey ret'
          } | socat - UNIX-CONNECT:build/qemu-monitor

          help_seen=0
          for _ in $(seq 1 40); do
            if grep -Fq 'HELP ABOUT MEM TICKS ALLOC CLEAR HALT' build/qemu.log; then help_seen=1; break; fi
            sleep 0.1
          done

          printf 'quit\n' | socat - UNIX-CONNECT:build/qemu-monitor || true
          set +e
          wait "$qemu_pid"
          rc=$?
          set -e

          cat build/qemu.log
          if [ "$help_seen" -ne 1 ]; then
            echo 'Keyboard IRQ command path failed; last QEMU interrupt trace lines:'
            tail -n 120 build/qemu-debug.log || true
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          test "$help_seen" -eq 1
          grep -Fq 'OSAURA KERNEL 0.3-DEV' build/qemu.log
          grep -Fq 'UEFI BOOT SERVICES: EXITED' build/qemu.log
          grep -Fq 'GDT: ACTIVE' build/qemu.log
          grep -Fq 'IDT: ACTIVE' build/qemu.log
          grep -Fq 'PIT IRQ0: ACTIVE' build/qemu.log
          grep -Fq 'PS2 IRQ1: ACTIVE' build/qemu.log
          grep -Fq 'PAGE ALLOCATOR: ACTIVE' build/qemu.log
          grep -Fq 'HELP ABOUT MEM TICKS ALLOC CLEAR HALT' build/qemu.log

      - name: Upload boot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osaura-uefi-x86_64
          path: |
            build/BOOTX64.EFI
            build/osaura.img
            build/qemu.log
            build/qemu-debug.log
