name: Processor Bus Win64 CI

on:
  push:
    branches: [jx-live-book-generations]
    paths:
      - 'kernel/processor-bus.c'
      - 'kernel/processor-bus.h'
      - 'kernel/security.h'
      - 'host/windows/processor-bus-win64.c'
      - 'host/windows/processor-bus-win64.h'
      - 'host/windows/processor-bus-autobind-win64.c'
      - 'host/windows/processor-bus-autobind-win64.h'
      - 'host/windows/runtime64.c'
      - 'host/windows/runtime64.h'
      - 'host/windows/security-host.c'
      - 'tests/wsjx64-bus-test.c'
      - '.github/workflows/processor-bus-win64-ci.yml'
  pull_request:
    paths:
      - 'kernel/processor-bus.c'
      - 'kernel/processor-bus.h'
      - 'host/windows/processor-bus-win64.c'
      - 'host/windows/processor-bus-win64.h'
      - 'host/windows/processor-bus-autobind-win64.c'
      - 'host/windows/processor-bus-autobind-win64.h'
      - 'host/windows/runtime64.c'
      - 'host/windows/runtime64.h'
      - 'tests/wsjx64-bus-test.c'
      - '.github/workflows/processor-bus-win64-ci.yml'

jobs:
  parity:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Initialize x64 MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile runtime64
        shell: cmd
        run: cl /nologo /W4 /WX /c host\windows\runtime64.c /DOSAURA_RUNTIME64_SOURCE /Iinclude /Ikernel /Ihost\windows /Foruntime64.obj
      - name: Build shared processor bus startup test on Win64
        shell: cmd
        run: >-
          cl /nologo /W4 /WX
          tests\wsjx64-bus-test.c
          host\windows\processor-bus-win64.c
          host\windows\processor-bus-autobind-win64.c
          host\windows\security-host.c
          kernel\processor-bus.c
          runtime64.obj
          /Iinclude /Ikernel /Ihost\windows
          /link /MACHINE:X64 /OUT:wsjx64-bus-test.exe
      - name: Verify processor bus startup parity
        shell: powershell
        run: |
          .\wsjx64-bus-test.exe | Tee-Object -FilePath wsjx64-bus.txt
          $text = Get-Content wsjx64-bus.txt -Raw
          if ($text -notmatch 'WSJX64 PROCESSOR BUS AUTOBIND: PASS') { throw 'WSJX64 processor bus startup autobind failed' }
