      - 'host/windows/hot64.c'
      - 'host/windows/hot64.h'
      - 'tests/wsjx64-hot-test.c'
      - 'include/osaura/socket.h'
      - 'kernel/socket.c'
      - 'kernel/security.h'
      - 'kernel/processor-bus.c'
      - 'kernel/processor-bus.h'
      - 'kernel/hot-shadow.c'
      - 'kernel/hot-shadow.h'
      - 'kernel/ipc.h'
      - 'kernel/scheduler.h'
      - 'kernel/clock-hot.h'
      - 'kernel/memory-hot.h'
      - 'kernel/task-hot.h'
      - 'kernel/display.c'
      - 'kernel/display.h'
      - 'runtime/jx/jx11-display.c'
      - 'runtime/jx/jx11-display.h'
      - 'runtime/jx/jx11-surface.c'
      - 'runtime/jx/jx11-surface.h'
      - 'runtime/jx/jx11-window.c'
      - 'runtime/jx/jx11-window.h'
      - 'runtime/jx/jx11-listener-events.c'
      - 'runtime/jx/jx11-listener-events.h'
      - '.github/workflows/wsjx-ci.yml'
  pull_request:
    paths:
      - 'host/windows/wsjx.c'
      - 'host/windows/security-host.c'
      - 'host/windows/socket-winsock.c'
      - 'host/windows/socket-winsock.h'
      - 'host/windows/display-win32.c'
      - 'host/windows/display-win32.h'
      - 'host/windows/jx11-surface-win64.c'
      - 'host/windows/jx11-surface-win64.h'
      - 'host/windows/jx11-listener-events-autoinit-win64.c'
      - 'host/windows/processor-bus-win64.c'
      - 'host/windows/processor-bus-win64.h'
      - 'host/windows/processor-bus-autobind-win64.c'
      - 'host/windows/processor-bus-autobind-win64.h'
      - 'host/windows/vfs64.c'
      - 'host/windows/vfs64.h'
      - 'host/windows/runtime64.c'
      - 'host/windows/runtime64.h'
      - 'host/windows/hot64.c'
      - 'host/windows/hot64.h'
      - 'tests/wsjx64-hot-test.c'
      - 'include/osaura/socket.h'
      - 'kernel/socket.c'
      - 'kernel/security.h'
      - 'kernel/processor-bus.c'
      - 'kernel/processor-bus.h'
      - 'kernel/hot-shadow.c'
      - 'kernel/hot-shadow.h'
      - 'kernel/ipc.h'
      - 'kernel/scheduler.h'
      - 'kernel/clock-hot.h'
      - 'kernel/memory-hot.h'
      - 'kernel/task-hot.h'
      - 'kernel/display.c'
      - 'kernel/display.h'
      - 'runtime/jx/jx11-display.c'
      - 'runtime/jx/jx11-display.h'
      - 'runtime/jx/jx11-surface.c'
      - 'runtime/jx/jx11-surface.h'
      - 'runtime/jx/jx11-window.c'
      - 'runtime/jx/jx11-window.h'
      - 'runtime/jx/jx11-listener-events.c'
      - 'runtime/jx/jx11-listener-events.h'
      - '.github/workflows/wsjx-ci.yml'

jobs:
  wsjx64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize x64 MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile runtime64 core
        shell: cmd
        run: cl /nologo /W4 /WX /c host\windows\runtime64.c /DOSAURA_RUNTIME64_SOURCE /Iinclude /Ikernel /Iruntime\jx /Foruntime64.obj

      - name: Build WSJX64 hot conformance test
        shell: cmd
        run: cl /nologo /W4 /WX /DOSAURA_HOT_HOSTED tests\wsjx64-hot-test.c host\windows\hot64.c host\windows\security-host.c kernel\hot-shadow.c runtime64.obj /Iinclude /Ikernel /Ihost\windows /link /MACHINE:X64 /OUT:wsjx64-hot-test.exe

      - name: Run WSJX64 hot conformance test
        shell: powershell
        run: |
          .\wsjx64-hot-test.exe | Tee-Object -FilePath wsjx64-hot.txt
          $hot = Get-Content wsjx64-hot.txt -Raw
          if ($hot -notmatch 'WSJX64 HOT BANKS: PASS') { throw 'hot-bank self-test failed' }
          if ($hot -notmatch 'CLOCK C0-C7: BOUND') { throw 'CLOCK hot bank missing' }
          if ($hot -notmatch 'MEMORY C8-CF: BOUND') { throw 'MEMORY hot bank missing' }
          if ($hot -notmatch 'TASK D0-D7: BOUND') { throw 'TASK hot bank missing' }
          if ($hot -notmatch 'F0-FF: UNASSIGNED') { throw 'reserved hot banks were consumed' }

      - name: Build wsjx64.exe
        shell: cmd
        run: cl /nologo /W4 /WX host\windows\wsjx.c host\windows\security-host.c host\windows\socket-winsock.c host\windows\display-win32.c host\windows\jx11-surface-win64.c host\windows\jx11-listener-events-autoinit-win64.c host\windows\processor-bus-win64.c host\windows\processor-bus-autobind-win64.c host\windows\vfs64.c kernel\socket.c kernel\display.c kernel\processor-bus.c runtime\jx\jx11-display.c runtime\jx\jx11-surface.c runtime\jx\jx11-window.c runtime\jx\jx11-listener-events.c runtime64.obj /Iinclude /Ikernel /Iruntime\jx /Ihost\windows /link /MACHINE:X64 Ws2_32.lib User32.lib Gdi32.lib /OUT:wsjx64.exe

      - name: Verify PE64 machine type
        shell: powershell
        run: |
          $headers = dumpbin /headers .\wsjx64.exe | Out-String
          if ($headers -notmatch 'machine \(x64\)') { throw 'wsjx64.exe is not PE32+ x64' }

      - name: Create VFS64 Book fixture
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\wsjx-root | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $PWD 'wsjx-root\ci.64B'), [byte[]](0x4A,0x58,0x36,0x34,0x80,0x81,0x00,0x02,0xC0,0x45,0x4E,0x44))

      - name: Smoke test WSJX64 hosted machine
        shell: powershell
        run: |
          @"
          PLATFORM
          STATUS
          CAPS
          MODE JXL
          STATUS
          SOCKET
          MOUNTS
          VFS TEST
          LOAD /ci.64B
          CLOCK
          MEM TEST
          TASKS
          IPC TEST
          INPUT
          DISPLAY
          DISPLAY TEST
          EXIT
          "@ | .\wsjx64.exe | Tee-Object -FilePath wsjx64-smoke.txt
          $text = Get-Content wsjx64-smoke.txt -Raw
          if ($text -notmatch 'WSJX64 - WINDOWS SUBSYSTEM FOR JX64') { throw 'WSJX64 banner missing' }
          if ($text -notmatch 'PLATFORM: WSJX64 / AMD64') { throw 'Win64 platform contract missing' }
          if ($text -notmatch 'POINTER WIDTH: 64') { throw '64-bit pointer contract missing' }
          if ($text -notmatch 'USER64: WINDOWS USER API') { throw 'USER64 backend missing' }
          if ($text -notmatch 'GDI64: WINDOWS GDI API') { throw 'GDI64 backend missing' }
          if ($text -notmatch 'MODE: JXL') { throw 'JXL mode switch missing' }
          if ($text -notmatch 'JX SOCKET: PASS') { throw 'Winsock64 path failed' }
          if ($text -notmatch 'VFS64 TEST: PASS') { throw 'VFS64 path failed' }
          if ($text -notmatch 'LOADED VIA VFS64: /ci.64B') { throw 'Book load did not use VFS64' }
          if ($text -notmatch 'CLOCK64 TICKS:') { throw 'CLOCK64 missing' }
          if ($text -notmatch 'MEMORY64 TEST: PASS') { throw 'MEMORY64 path failed' }
          if ($text -notmatch 'TASK64 COUNT: 3') { throw 'TASK64 state missing' }
          if ($text -notmatch 'IPC64 TEST: PASS') { throw 'IPC64 path failed' }
          if ($text -notmatch 'INPUT64:') { throw 'INPUT64 state missing' }
          if ($text -notmatch 'JX11 DISPLAY: 1024x768') { throw 'JX11 display backend missing' }
          if ($text -notmatch 'JX11 DISPLAY TEST: PASS') { throw 'JX11 draw path failed' }
          if ($text -notmatch 'F0-FF: RESERVED') { throw 'reserved opcode invariant missing' }
